[project]
name = "ai-hunter"
version = "0.1.0"
description = "Multi-agent B2B lead hunting system powered by LangGraph"
requires-python = ">=3.11"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["api", "agents", "automation", "config", "emailing", "graph", "observability", "persistence", "prompts", "services", "tools"]

[tool.setuptools.package-data]
api = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]
markers = [
    "live: marks tests that hit real external APIs (deselect with '-m not live')",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
